  <div id="__bundler_placeholder">Loading Bee Tasty Story...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"background:none;border:2px solid transparent;padding:10px 14px;min-height:44px;font-weight:800;font-size:15px;border-radius:999px;color:#17140F\">Головна<\u002Fbutton>\n        <sc-if value=\"{{isHome}}\" hint-placeholder-val=\"{{true}}\">\n          <a href=\"#story\" style=\"padding:10px 14px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;font-weight:800;font-size:15px;text-decoration:none\">Історія<\u002Fa>\n          <a href=\"#places\" style=\"padding:10px 14px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;font-weight:800;font-size:15px;text-decoration:none\">Адреси<\u002Fa>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{goMenu}}\" style=\"background:#17140F;border:2px solid #17140F;padding:10px 20px;min-height:44px;font-weight:800;font-size:15px;border-radius:999px;color:#FFC21A\">Меню<\u002Fbutton>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{isHome}}\" hint-placeholder-val=\"{{true}}\">\n  <main>\n    <section style=\"background:#FFC21A\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:56px 24px 72px;display:flex;flex-wrap:wrap;align-items:center;gap:40px\">\n        <div style=\"flex:1 1 440px;min-width:0\">\n          <p style=\"margin:0 0 16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px\">Кав'ярня й випічка · Вінниця<\u002Fp>\n          <h1 style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(40px,6vw,68px);line-height:1.05\">Твоя смачна історія<\u002Fh1>\n          <p style=\"margin:24px 0 32px;font-size:20px;line-height:1.5;max-width:520px\">Кава й випічка для твого дня у Вінниці. І кав'ярня, яка допомагає армії.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n            <a href=\"#autumn\" style=\"background:#17140F;color:#FFC21A;text-decoration:none;font-weight:800;font-size:16px;padding:14px 26px;min-height:44px;box-sizing:border-box;border-radius:999px;display:inline-flex;align-items:center\">Новинка осені<\u002Fa>\n            <button sc-camel-on-click=\"{{goMenu}}\" style=\"background:transparent;color:#17140F;border:2px solid #17140F;font-weight:800;font-size:16px;padding:12px 26px;min-height:44px;border-radius:999px\">Дивитися меню<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 320px;max-width:440px;min-width:0\">\n          <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 400 400\" width=\"100%\" style=\"display:block\">\n            <g transform=\"translate(95,95)\"><polygon points=\"0,-60 52,-30 52,30 0,60 -52,30 -52,-30\" fill=\"#FFE08A\"><\u002Fpolygon><\u002Fg>\n            <g transform=\"translate(300,85)\"><polygon points=\"0,-44 38,-22 38,22 0,44 -38,22 -38,-22\" fill=\"#17140F\"><\u002Fpolygon><\u002Fg>\n            <g transform=\"translate(335,230)\"><polygon points=\"0,-52 45,-26 45,26 0,52 -45,26 -45,-26\" fill=\"#FFE08A\"><\u002Fpolygon><\u002Fg>\n            <g transform=\"translate(60,260)\"><polygon points=\"0,-40 35,-20 35,20 0,40 -35,20 -35,-20\" fill=\"#17140F\"><\u002Fpolygon><\u002Fg>\n            <ellipse cx=\"200\" cy=\"338\" rx=\"130\" ry=\"20\" fill=\"#17140F\"><\u002Fellipse>\n            <path d=\"M285 210 Q350 205 345 255 Q340 300 280 292\" fill=\"none\" stroke=\"#17140F\" stroke-width=\"12\" stroke-linecap=\"round\"><\u002Fpath>\n            <path d=\"M105 195 H295 V255 Q295 332 200 332 Q105 332 105 255 Z\" fill=\"#FFF6DC\" stroke=\"#17140F\" stroke-width=\"8\" stroke-linejoin=\"round\"><\u002Fpath>\n            <ellipse cx=\"200\" cy=\"195\" rx=\"95\" ry=\"20\" fill=\"#B7CC6A\" stroke=\"#17140F\" stroke-width=\"8\"><\u002Fellipse>\n            <ellipse cx=\"200\" cy=\"192\" rx=\"62\" ry=\"10\" fill=\"#E9F0C8\"><\u002Fellipse>\n            <circle cx=\"170\" cy=\"190\" r=\"5\" fill=\"#7C9437\"><\u002Fcircle><circle cx=\"198\" cy=\"186\" r=\"5\" fill=\"#7C9437\"><\u002Fcircle><circle cx=\"224\" cy=\"192\" r=\"5\" fill=\"#7C9437\"><\u002Fcircle><circle cx=\"210\" cy=\"198\" r=\"4\" fill=\"#7C9437\"><\u002Fcircle>\n            <path d=\"M160 160 Q145 135 162 115 Q178 95 160 72 M205 160 Q190 135 207 115 Q223 95 205 72 M250 160 Q235 135 252 115 Q268 95 250 72\" fill=\"none\" stroke=\"#17140F\" stroke-width=\"7\" stroke-linecap=\"round\"><\u002Fpath>\n            <path d=\"M150 262 H250\" stroke=\"#FFC21A\" stroke-width=\"14\" stroke-linecap=\"round\"><\u002Fpath>\n            <path d=\"M158 290 H242\" stroke=\"#17140F\" stroke-width=\"14\" stroke-linecap=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section aria-label=\"Коротко про нас\" style=\"background:#17140F;color:#FFC21A\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;font-family:'Unbounded',sans-serif;font-weight:500;font-size:16px\">\n        <span>Смак, що розповідає історію<\u002Fspan>\n        <span>Щодня 08:00–20:00<\u002Fspan>\n        <span>Кава · випічка · десерти<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"autumn\" style=\"background:#2A1B10;color:#FFF6DC\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:72px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:48px\">\n        <div style=\"flex:1 1 420px;min-width:0\">\n          <span style=\"display:inline-block;background:#B7CC6A;color:#17140F;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px\">Новинка<\u002Fspan>\n          <h2 style=\"margin:20px 0 16px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(34px,4.5vw,52px);line-height:1.1\">Смак осені<\u002Fh2>\n          <p style=\"margin:0 0 28px;font-size:18px;line-height:1.55;max-width:480px;color:#F1E6C4\">Фісташкова осінь у Bee Tasty Story. Оберіть позицію, а всі осінні новинки зібрані в меню.<\u002Fp>\n          <div role=\"group\" aria-label=\"Осінні новинки\" style=\"display:flex;flex-wrap:wrap;gap:10px\">\n            <sc-for list=\"{{picks}}\" as=\"p\" hint-placeholder-count=\"2\">\n              <sc-if value=\"{{p.on}}\" hint-placeholder-val=\"{{true}}\">\n                <button sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"true\" style=\"background:#B7CC6A;color:#17140F;border:2px solid #B7CC6A;font-weight:800;font-size:16px;padding:12px 22px;min-height:44px;border-radius:999px\">{{p.label}}<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{p.off}}\" hint-placeholder-val=\"{{false}}\">\n                <button sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"false\" style=\"background:transparent;color:#FFF6DC;border:2px solid #B7CC6A;font-weight:800;font-size:16px;padding:12px 22px;min-height:44px;border-radius:999px\">{{p.label}}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 340px;min-width:0\">\n          <div aria-live=\"polite\" style=\"background:#FFF6DC;color:#17140F;border-radius:28px;padding:32px;box-shadow:10px 10px 0 #B7CC6A\">\n            <p style=\"margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5B5340\">Обрано<\u002Fp>\n            <h3 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:28px;line-height:1.15\">{{pickTitle}}<\u002Fh3>\n            <p style=\"margin:0 0 20px;font-size:17px;line-height:1.5\">{{pickDesc}}<\u002Fp>\n            <p style=\"margin:0 0 24px;font-family:'Unbounded',sans-serif;font-weight:500;font-size:24px\">{{pickPrice}}<\u002Fp>\n            <button sc-camel-on-click=\"{{goAutumnMenu}}\" style=\"background:#17140F;color:#FFC21A;border:2px solid #17140F;font-weight:800;font-size:16px;padding:14px 26px;min-height:44px;border-radius:999px\">Дивитися в меню<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"story\" style=\"background:#FFF6DC\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:72px 24px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n        <div style=\"flex:1 1 440px;min-width:0\">\n          <h2 style=\"margin:0 0 20px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(30px,4vw,44px);line-height:1.1\">Кав'ярня з сенсом<\u002Fh2>\n          <p style=\"margin:0 0 16px;font-size:18px;line-height:1.6\">Bee Tasty Story відкрила Юлія. Вона створила цю справу, щоб робити смачну каву й водночас допомагати армії.<\u002Fp>\n          <p style=\"margin:0;font-size:17px;line-height:1.6;color:#5B5340;border:2px dashed #8A7D5A;border-radius:16px;padding:14px 18px\">[Тут буде історія словами власниці. Текст узгодити з Юлією до публікації.]<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 340px;min-width:0;background:#FFC21A;border:3px solid #17140F;border-radius:28px;padding:32px\">\n          <h3 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:24px;line-height:1.2\">Допомагаємо армії<\u002Fh3>\n          <p style=\"margin:0 0 16px;font-size:17px;line-height:1.55\">Частина справи кав'ярні працює на підтримку військових.<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.5;color:#17140F;border:2px dashed #17140F;border-radius:16px;padding:12px 16px\">[Останній збір · сума · як долучитися]<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"places\" style=\"background:#FFFFFF;border-top:3px solid #17140F\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:72px 24px\">\n        <h2 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(30px,4vw,44px);line-height:1.1\">Наші точки<\u002Fh2>\n        <p style=\"margin:0 0 32px;font-size:16px;color:#5B5340\">Години роботи з Google: щодня 08:00–20:00. Для кожної точки уточнимо.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n          <div style=\"border:3px solid #17140F;border-radius:24px;padding:28px;background:#FFF6DC\">\n            <h3 style=\"margin:0 0 8px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px\">Київська 43<\u002Fh3>\n            <p style=\"margin:0 0 20px;font-size:16px;color:#5B5340\">Вінниця · щодня 08:00–20:00<\u002Fp>\n            <a href=\"https://www.google.com/maps/search/?api=1&amp;query=Вінниця,+Київська+43\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;font-weight:800;color:#17140F\">Прокласти маршрут<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"border:3px solid #17140F;border-radius:24px;padding:28px;background:#FFF6DC\">\n            <h3 style=\"margin:0 0 8px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px\">Соборна 53Б<\u002Fh3>\n            <p style=\"margin:0 0 20px;font-size:16px;color:#5B5340\">Вінниця · щодня 08:00–20:00<\u002Fp>\n            <a href=\"https://www.google.com/maps/search/?api=1&amp;query=Вінниця,+Соборна+53Б\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;font-weight:800;color:#17140F\">Прокласти маршрут<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"border:3px solid #17140F;border-radius:24px;padding:28px;background:#FFF6DC\">\n            <h3 style=\"margin:0 0 8px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px\">Академіка Янгеля 6к<\u002Fh3>\n            <p style=\"margin:0 0 20px;font-size:16px;color:#5B5340\">ЖК «Династія» · щодня 08:00–20:00<\u002Fp>\n            <a href=\"https://www.google.com/maps/search/?api=1&amp;query=Вінниця,+Академіка+Янгеля+6к\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;font-weight:800;color:#17140F\">Прокласти маршрут<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#FFC21A;border-top:3px solid #17140F\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:56px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px\">\n        <h2 style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(26px,3.5vw,36px);line-height:1.15\">Заходьте за своєю історією<\u002Fh2>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <a href=\"https://www.instagram.com/beetasty.story.vn/\" target=\"_blank\" rel=\"noopener\" style=\"background:#17140F;color:#FFC21A;text-decoration:none;font-weight:800;font-size:16px;padding:14px 26px;min-height:44px;box-sizing:border-box;border-radius:999px;display:inline-flex;align-items:center\">Instagram<\u002Fa>\n          <a href=\"https://www.tiktok.com/@beetasty.story.vn\" target=\"_blank\" rel=\"noopener\" style=\"background:transparent;color:#17140F;text-decoration:none;font-weight:800;font-size:16px;padding:12px 26px;min-height:44px;box-sizing:border-box;border:2px solid #17140F;border-radius:999px;display:inline-flex;align-items:center\">TikTok<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isMenu}}\" hint-placeholder-val=\"{{false}}\">\n  <main>\n    <sc-if value=\"{{isAutumn}}\" hint-placeholder-val=\"{{false}}\">\n      <section style=\"background:#2A1B10;color:#FFF6DC\">\n        <div style=\"max-width:1200px;margin:0 auto;padding:56px 24px\">\n          <span style=\"display:inline-block;background:#B7CC6A;color:#17140F;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px\">Новинка<\u002Fspan>\n          <h1 style=\"margin:20px 0 12px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(36px,5vw,56px);line-height:1.08\">Смак осені<\u002Fh1>\n          <p style=\"margin:0;font-size:18px;line-height:1.55;max-width:560px;color:#F1E6C4\">Осінні новинки: фісташкові напої та десерти для холодних вечорів.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n    <sc-if value=\"{{notAutumn}}\" hint-placeholder-val=\"{{true}}\">\n      <section style=\"background:#FFC21A\">\n        <div style=\"max-width:1200px;margin:0 auto;padding:56px 24px\">\n          <h1 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(36px,5vw,56px);line-height:1.08\">Меню<\u002Fh1>\n          <p style=\"margin:0;font-size:18px;line-height:1.55;max-width:600px\">Асортимент кав'ярні. Це демо-меню: позиції й ціни з позначкою «демо» для прикладу, справжнє меню підставимо після погодження.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section style=\"background:#FFF6DC\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:32px 24px 72px\">\n        <div role=\"group\" aria-label=\"Категорії меню\" style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:36px\">\n          <sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"5\">\n            <sc-if value=\"{{c.on}}\" hint-placeholder-val=\"{{false}}\">\n              <button sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"true\" style=\"background:#17140F;color:#FFC21A;border:2px solid #17140F;font-weight:800;font-size:16px;padding:10px 22px;min-height:44px;border-radius:999px\">{{c.label}}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{c.off}}\" hint-placeholder-val=\"{{true}}\">\n              <button sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"false\" style=\"background:transparent;color:#17140F;border:2px solid #17140F;font-weight:800;font-size:16px;padding:10px 22px;min-height:44px;border-radius:999px\">{{c.label}}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"2\">\n          <section style=\"margin-bottom:48px\">\n            <sc-if value=\"{{g.isAutumn}}\" hint-placeholder-val=\"{{true}}\">\n              <div style=\"background:#2A1B10;color:#FFF6DC;border-radius:28px;padding:28px\">\n                <sc-if value=\"{{g.showTitle}}\" hint-placeholder-val=\"{{true}}\">\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px\">\n                    <h2 style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:28px;line-height:1.15\">{{g.title}}<\u002Fh2>\n                    <span style=\"background:#B7CC6A;color:#17140F;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px\">Новинки сезону<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n                  <sc-for list=\"{{g.items}}\" as=\"item\" hint-placeholder-count=\"2\">\n                    <article style=\"background:#FFFFFF;color:#17140F;border:3px solid #B7CC6A;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px\">\n                      <div style=\"display:flex;flex-wrap:wrap;gap:8px;min-height:24px\">\n                        <sc-if value=\"{{item.hasTag}}\" hint-placeholder-val=\"{{true}}\">\n                          <span style=\"background:#B7CC6A;color:#17140F;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px\">{{item.tag}}<\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{item.demo}}\" hint-placeholder-val=\"{{false}}\">\n                          <span style=\"border:2px dashed #8A7D5A;color:#5B5340;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 10px;border-radius:999px\">демо<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <h3 style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:19px;line-height:1.2\">{{item.name}}<\u002Fh3>\n                      <p style=\"margin:0;font-size:16px;line-height:1.5;color:#5B5340;flex:1\">{{item.desc}}<\u002Fp>\n                      <p style=\"margin:6px 0 0;font-family:'Unbounded',sans-serif;font-weight:500;font-size:20px\">{{item.price}}<\u002Fp>\n                    <\u002Farticle>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{g.notAutumn}}\" hint-placeholder-val=\"{{false}}\">\n              <div>\n                <sc-if value=\"{{g.showTitle}}\" hint-placeholder-val=\"{{false}}\">\n                  <h2 style=\"margin:0 0 20px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:28px;line-height:1.15\">{{g.title}}<\u002Fh2>\n                <\u002Fsc-if>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n                  <sc-for list=\"{{g.items}}\" as=\"item\" hint-placeholder-count=\"3\">\n                    <article style=\"background:#FFFFFF;border:3px solid #17140F;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px\">\n                      <div style=\"display:flex;flex-wrap:wrap;gap:8px;min-height:24px\">\n                        <sc-if value=\"{{item.demo}}\" hint-placeholder-val=\"{{true}}\">\n                          <span style=\"border:2px dashed #8A7D5A;color:#5B5340;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 10px;border-radius:999px\">демо<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <h3 style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:19px;line-height:1.2\">{{item.name}}<\u002Fh3>\n                      <p style=\"margin:0;font-size:16px;line-height:1.5;color:#5B5340;flex:1\">{{item.desc}}<\u002Fp>\n                      <p style=\"margin:6px 0 0;font-family:'Unbounded',sans-serif;font-weight:500;font-size:20px\">{{item.price}}<\u002Fp>\n                    <\u002Farticle>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"background:#17140F;color:#F1E6C4\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:28px 24px;font-size:14px;line-height:1.6\">\n      Демо-версія для узгодження концепції. Позиції з позначкою «демо» та позначки в [дужках] — приклади; справжні фото, логотип, меню й тексти підставимо після погодження з кав'ярнею.\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:2600}}\">\nclass Component extends DCLogic {\n  state = { view: 'home', cat: 'all', pick: 0 };\n\n  scrollTop() {\n    try { window.scrollTo(0, 0); } catch (e) {}\n  }\n\n  renderVals() {\n    const s = this.state;\n    const catalog = [\n      {\n        id: \"autumn\", title: \"Смак осені\", isAutumn: true,\n        items: [\n          { name: \"Фісташкове латте\", desc: \"Кава, молоко та фісташка. Осінь у чашці.\", price: \"90 / 100 ₴\", tag: \"Новинка\", demo: false },\n          { name: \"Фісташковий торт\", desc: \"Солодка новинка у вітрині.\", price: \"[ціна] ₴\", tag: \"Новинка\", demo: false },\n          { name: \"Пряний капучино\", desc: \"Кава з корицею та мускатним горіхом.\", price: \"85 ₴\", tag: \"Новинка\", demo: true },\n          { name: \"Яблучний штрудель\", desc: \"Тепле яблуко, кориця, хрустке тісто.\", price: \"70 ₴\", tag: \"Новинка\", demo: true }\n        ]\n      },\n      {\n        id: \"coffee\", title: \"Кава\",\n        items: [\n          { name: \"Еспресо\", desc: \"Класичний міцний шот.\", price: \"45 ₴\", tag: \"\", demo: true },\n          { name: \"Американо\", desc: \"Еспресо з гарячою водою.\", price: \"55 ₴\", tag: \"\", demo: true },\n          { name: \"Капучино\", desc: \"Еспресо, молоко й щільна пінка.\", price: \"70 / 85 ₴\", tag: \"\", demo: true },\n          { name: \"Латте\", desc: \"М'яка кава з великою кількістю молока.\", price: \"75 / 90 ₴\", tag: \"\", demo: true },\n          { name: \"Какао\", desc: \"Гаряче какао для холодного дня.\", price: \"65 ₴\", tag: \"\", demo: true },\n          { name: \"Холодна кава\", desc: \"Освіжаюча кава з льодом.\", price: \"80 ₴\", tag: \"\", demo: true }\n        ]\n      },\n      {\n        id: \"bakery\", title: \"Випічка\",\n        items: [\n          { name: \"Круасан\", desc: \"Масляний, з хрусткою скоринкою.\", price: \"55 ₴\", tag: \"\", demo: true },\n          { name: \"Булочка з корицею\", desc: \"М'яка, ароматна, ще тепла.\", price: \"50 ₴\", tag: \"\", demo: true },\n          { name: \"Сирник\", desc: \"Ніжний, зі сметаною.\", price: \"60 ₴\", tag: \"\", demo: true },\n          { name: \"Пиріг дня\", desc: \"Щодня нова начинка.\", price: \"65 ₴\", tag: \"\", demo: true }\n        ]\n      },\n      {\n        id: \"dessert\", title: \"Десерти\",\n        items: [\n          { name: \"Чізкейк\", desc: \"Вершковий, на тонкій основі.\", price: \"110 ₴\", tag: \"\", demo: true },\n          { name: \"Медовик\", desc: \"Класичний торт на меду.\", price: \"90 ₴\", tag: \"\", demo: true },\n          { name: \"Тірамісу\", desc: \"Кава, маскарпоне та какао.\", price: \"120 ₴\", tag: \"\", demo: true },\n          { name: \"Макарон\", desc: \"Хрусткий зовні, ніжний всередині.\", price: \"45 ₴\", tag: \"\", demo: true }\n        ]\n      }\n    ];\n    const cats = [\n      { id: \"all\", label: \"Усе\" },\n      { id: \"autumn\", label: \"Смак осені\" },\n      { id: \"coffee\", label: \"Кава\" },\n      { id: \"bakery\", label: \"Випічка\" },\n      { id: \"dessert\", label: \"Десерти\" }\n    ];\n    const picks = [\n      { label: \"Фісташкове латте\", desc: \"Кава, молоко та фісташка. Осінь у чашці.\", price: \"90 / 100 ₴\" },\n      { label: \"Фісташковий торт\", desc: \"Солодка новинка у вітрині, з фісташкою.\", price: \"[ціна] ₴\" }\n    ];\n    const current = picks[s.pick];\n    const onAutumn = s.view === 'menu' && s.cat === 'autumn';\n    const visible = catalog.filter((g) => s.cat === 'all' || s.cat === g.id);\n\n    return {\n      isHome: s.view === 'home',\n      isMenu: s.view === 'menu',\n      isAutumn: onAutumn,\n      notAutumn: !onAutumn,\n      goHome: () => { this.setState({ view: 'home' }); this.scrollTop(); },\n      goMenu: () => { this.setState({ view: 'menu', cat: 'all' }); this.scrollTop(); },\n      goAutumnMenu: () => { this.setState({ view: 'menu', cat: 'autumn' }); this.scrollTop(); },\n      picks: picks.map((p, idx) => ({\n        label: p.label,\n        on: s.pick === idx,\n        off: s.pick !== idx,\n        pick: () => this.setState({ pick: idx })\n      })),\n      pickTitle: current.label,\n      pickDesc: current.desc,\n      pickPrice: current.price,\n      chips: cats.map((c) => ({\n        label: c.label,\n        on: s.cat === c.id,\n        off: s.cat !== c.id,\n        pick: () => this.setState({ cat: c.id })\n      })),\n      groups: visible.map((g) => ({\n        title: g.title,\n        isAutumn: !!g.isAutumn,\n        notAutumn: !g.isAutumn,\n        showTitle: s.cat === 'all',\n        items: g.items.map((i) => ({\n          name: i.name, desc: i.desc, price: i.price, tag: i.tag,\n          hasTag: i.tag !== \"\", demo: i.demo\n        }))\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
